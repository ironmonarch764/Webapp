name: Create Keystore
on: workflow_dispatch
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          keytool -genkeypair -keystore app/webapp.jks -storetype JKS -keyalg RSA -keysize 2048 -validity 36500 -alias webapp -storepass webapp123 -keypass webapp123 -dname "CN=Webapp"
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add app/webapp.jks
          git commit -m "Add keystore"
          git push
